<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FitAI — 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f7;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #1d1d1f;
  }
  .card {
    background: #ffffff; border: 1px solid rgba(0,0,0,0.06);
    border-radius: 18px; padding: 40px; width: 100%; max-width: 400px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.08);
  }
  .logo { text-align: center; margin-bottom: 24px; }
  .logo h1 { font-size: 32px; font-weight: 800; color: #1d1d1f; letter-spacing: -0.02em; }
  .logo p { font-size: 13px; color: #86868b; margin-top: 4px; }
  .tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 1px solid rgba(0,0,0,0.08); }
  .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-size: 14px; color: #86868b; border-bottom: 2px solid transparent; transition: all 0.2s; background: none; border-top: none; border-left: none; border-right: none; }
  .tab.active { color: #0071e3; border-bottom-color: #0071e3; }
  .form { display: flex; flex-direction: column; gap: 16px; }
  .form label { font-size: 12px; color: #6e6e73; }
  .form input { padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.12); background: #ffffff; color: #1d1d1f; font-size: 16px; outline: none; transition: border 0.2s; }
  .form input:focus { border-color: #0071e3; }
  .form input::placeholder { color: #c7c7cc; }
  .btn { padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; background: #0071e3; color: #ffffff; transition: background 0.2s; }
  .btn:hover { background: #0077ed; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { padding: 10px 12px; font-size: 13px; color: #d70015; background: rgba(215,0,21,0.06); border: 1px solid rgba(215,0,21,0.15); border-radius: 8px; display: none; }
  .error.show { display: block; }
  .hint { font-size: 12px; color: #86868b; margin-top: 4px; }
  #setupForm { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>FitAI</h1>
    <p>智能运动健康助手</p>
    <p id="pageHint" style="margin-top:12px;font-size:13px;color:#667;"></p>
  </div>
  <div id="setupForm">
    <form class="form" onsubmit="handleSetup(event)">
      <label>设置管理员账号</label>
      <input id="sUser" placeholder="账号（3-32位）" required autocomplete="username">
      <label>设置密码</label>
      <input id="sPass" type="password" placeholder="至少8位，含大小写字母+数字" required autocomplete="new-password">
      <label>确认密码</label>
      <input id="sPass2" type="password" placeholder="再次输入密码" required>
      <div class="hint">密码要求：至少 8 位，必须同时包含大写字母、小写字母和数字</div>
      <div id="setupError" class="error"></div>
      <button class="btn" type="submit" id="setupBtn">设置并登录</button>
    </form>
  </div>
  <div id="authForm">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">登录</button>
      <button class="tab" id="regTab" onclick="switchTab('register')">注册</button>
    </div>
    <form class="form" onsubmit="handleAuth(event)" autocomplete="on">
      <label>账号</label>
      <input id="aUser" placeholder="请输入账号" required autocomplete="username">
      <label>密码</label>
      <input id="aPass" type="password" placeholder="请输入密码" required autocomplete="current-password">
      <div id="confirmField" style="display:none;">
        <label>确认密码</label>
        <input id="aPass2" type="password" placeholder="再次输入密码" autocomplete="new-password">
      </div>
      <div id="authError" class="error"></div>
      <button class="btn" type="submit" id="authBtn">登录</button>
    </form>
  </div>
</div>
<script>
let mode = 'login';
let isSetup = false;
const urlParams = new URLSearchParams(window.location.search);
const setupSecret = urlParams.get('setup') || '';

async function init() {
  try {
    const resp = await fetch('/api/auth/status');
    const data = await resp.json();
    if (data.authenticated) { window.location.href = '/app'; return; }
    isSetup = data.setup_allowed;
    if (isSetup) {
      document.getElementById('setupForm').style.display = 'block';
      document.getElementById('authForm').style.display = 'none';
      document.getElementById('pageHint').textContent = '首次初始化，请设置管理员账号和密码';
    } else if (!data.auth_enabled) {
      document.getElementById('pageHint').textContent = '请先联系管理员完成首次初始化';
      document.getElementById('regTab').style.display = 'none';
    }
    if (!data.registration_allowed && !isSetup && data.auth_enabled) {
      document.getElementById('regTab').style.display = 'none';
    }
  } catch(e) {
    document.getElementById('pageHint').textContent = '无法连接到服务器';
  }
}

function switchTab(t) {
  mode = t;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  var target = t === 'login' ? document.querySelector('.tab[onclick*="login"]') : document.getElementById('regTab');
  if (target) target.classList.add('active');
  document.getElementById('confirmField').style.display = t === 'register' ? 'block' : 'none';
  document.getElementById('authBtn').textContent = t === 'login' ? '登录' : '注册';
  document.getElementById('authError').classList.remove('show');
}

async function handleSetup(e) {
  e.preventDefault();
  const u = document.getElementById('sUser').value.trim();
  const p = document.getElementById('sPass').value;
  const p2 = document.getElementById('sPass2').value;
  const err = document.getElementById('setupError');
  if (p !== p2) { err.textContent = '两次输入的密码不一致'; err.classList.add('show'); return; }
  err.classList.remove('show');
  document.getElementById('setupBtn').disabled = true;
  try {
    const resp = await fetch('/api/auth/setup', {
      method: 'POST', headers: {'Content-Type': 'application/json', 'X-Setup-Secret': setupSecret},
      body: JSON.stringify({username: u, password: p})
    });
    const data = await resp.json();
    if (!resp.ok) { err.textContent = data.detail || '操作失败'; err.classList.add('show'); return; }
    window.location.href = '/app';
  } catch(ex) {
    err.textContent = '网络错误，请重试'; err.classList.add('show');
  } finally {
    document.getElementById('setupBtn').disabled = false;
  }
}

async function handleAuth(e) {
  e.preventDefault();
  const u = document.getElementById('aUser').value.trim();
  const p = document.getElementById('aPass').value;
  const err = document.getElementById('authError');
  if (mode === 'register') {
    const p2 = document.getElementById('aPass2').value;
    if (p !== p2) { err.textContent = '两次输入的密码不一致'; err.classList.add('show'); return; }
  }
  err.classList.remove('show');
  document.getElementById('authBtn').disabled = true;
  try {
    const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
    const body = mode === 'register' ? {username: u, password: p, email: null} : {username: u, password: p};
    const resp = await fetch(endpoint, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (!resp.ok) { err.textContent = data.detail || '操作失败'; err.classList.add('show'); return; }
    window.location.href = '/app';
  } catch(ex) {
    err.textContent = '网络错误，请重试'; err.classList.add('show');
  } finally {
    document.getElementById('authBtn').disabled = false;
  }
}

init();
</script>
</body>
</html>
