version: "3.9"

services:
  fitai:
    build: .
    container_name: fitai-web
    ports:
      - "8000:8000"
    volumes:
      - fitai_data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  fitai_data:
    driver: local
